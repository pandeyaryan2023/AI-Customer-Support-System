<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – Support Desk</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <h1>Support Desk</h1>
    <p class="subtitle">Create a customer account</p>

    <div id="notice" class="notice" hidden role="alert"></div>

    <form id="register-form" class="card">
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" type="text" autocomplete="name" minlength="2" maxlength="100" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password (at least 8 characters)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-block" type="submit">Register</button>
      <p class="small muted" style="text-align:center; margin-top:1rem">
        Already registered? <a href="login.html">Log in</a>
      </p>
    </form>
  </main>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
